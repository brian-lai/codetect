title: codetect
description: Fast, token-efficient codebase search for every LLM
url: "https://brian-lai.github.io"
baseurl: "/codetect"

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - _old-readme.md

aux_links:
  "GitHub":
    - "https://github.com/brian-lai/codetect"

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

search_enabled: true
search.heading_level: 3

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "codetect is open source under the MIT License."

plugins:
  - jekyll-remote-theme
